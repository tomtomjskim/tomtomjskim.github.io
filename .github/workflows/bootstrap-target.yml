name: Bootstrap target branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-target.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: site/initial-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore site source
        run: |
          cat .bootstrap/part-* > /tmp/site.tar.gz.b64
          base64 --decode /tmp/site.tar.gz.b64 > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C .
          npm install --package-lock-only --ignore-scripts

      - name: Commit site source
        run: |
          rm -rf .bootstrap .github/workflows/bootstrap-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'site: implement Korean-first GitHub Pages portfolio'
          git push origin HEAD:site/initial-pages
