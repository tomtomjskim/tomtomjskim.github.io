name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Checkout portfolio source
        uses: actions/checkout@v6
        with:
          repository: tomtomjskim/portfolio
          ref: main
          path: portfolio-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source content
        run: npm run validate:content
        env:
          PORTFOLIO_SOURCE_DIR: portfolio-source

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          PORTFOLIO_SOURCE_DIR: portfolio-source

      - name: Static smoke test
        run: npm run smoke:static

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
